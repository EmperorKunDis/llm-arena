# arena.svanda.tech -> LLM Arena on 127.0.0.1:3400 (TLS terminated here or by Cloudflare).
server {
    listen 80;
    listen [::]:80;
    server_name arena.svanda.tech;

    client_max_body_size 8k;          # the API only accepts tiny JSON bodies
    proxy_read_timeout 150s;          # live generation can take ~1-2 min on free models

    location / {
        proxy_pass http://127.0.0.1:3400;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
    }
}
