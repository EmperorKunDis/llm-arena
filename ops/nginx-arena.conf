# arena.svanda.tech -> LLM Arena on 127.0.0.1:3400.
#
# Cloudflare SSL mode "Full": Cloudflare connects to this origin over HTTPS on 443
# and does not validate the certificate. Use a Cloudflare Origin Certificate for
# "*.svanda.tech, svanda.tech" (SSL/TLS -> Origin Server -> Create certificate),
# saved as the two files below. The same certificate also works if the zone is
# later switched to "Full (strict)". If the portfolio's nginx already has a
# certificate covering *.svanda.tech, point the two ssl_certificate lines at it:
#   sudo nginx -T | grep -E "server_name|ssl_certificate"

server {
    listen 80;
    listen [::]:80;
    server_name arena.svanda.tech;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name arena.svanda.tech;

    ssl_certificate     /etc/ssl/cloudflare/svanda.tech.pem;
    ssl_certificate_key /etc/ssl/cloudflare/svanda.tech.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 8k;          # the API only accepts tiny JSON bodies
    proxy_read_timeout 150s;          # live generation can take ~1-2 min on free models

    location / {
        proxy_pass http://127.0.0.1:3400;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
    }
}
